name: bellhaven-crm-daily-sync

on:
  schedule:
    - cron: "17 11 * * *"        # 11:17 UTC = 07:17 US Eastern (06:17 in winter); GitHub cron is always UTC
  workflow_dispatch: {}          # manual "Run workflow" button

concurrency:
  group: bellhaven-crm-sync      # never two runs at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests (mock CRM, no network to the real CRM)
        run: |
          python -m unittest tests.test_e2e
          python -m unittest tests.test_app

      # The decision store (which proposals were approved/rejected) is what makes re-runs safe, so it must
      # outlive the ephemeral runner. In production this would be a managed database (see README);
      # the Actions cache is the zero-infrastructure stand-in.
      - name: Restore decision store
        uses: actions/cache/restore@v4
        with:
          path: data/review.db
          key: bh-review-db-${{ github.run_id }}
          restore-keys: bh-review-db-

      - name: Scrape, match, queue proposals (never writes to the CRM)
        env:
          BH_CRM_TOKEN: ${{ secrets.BH_CRM_TOKEN }}
        run: python pipeline.py

      - name: Save decision store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/review.db
          key: bh-review-db-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: classification-report
          path: data/classification.json
