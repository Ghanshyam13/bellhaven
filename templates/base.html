<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Bellhaven CRM review{% endblock %}</title>
<style>
  :root { --bg:#f7f4ec; --card:#fff; --ink:#2b1a1d; --muted:#7a6a6d; --line:#e6dfd2; --accent:#b8334f;
          --ok:#2f7d4f; --warn:#a8741a; --bad:#b8334f; --blue:#2b5d8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 28px; display:flex; gap:24px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; color:var(--accent); }
  header nav a { margin-right:16px; color:var(--ink); text-decoration:none; font-weight:600; }
  header nav a.on { color:var(--accent); border-bottom:2px solid var(--accent); }
  header .meta { margin-left:auto; color:var(--muted); font-size:13px; }
  main { max-width:1080px; margin:22px auto 80px; padding:0 20px; }
  .flash { background:#fff8e1; border:1px solid #ecd9a0; border-left:4px solid #d9b13b; padding:10px 14px; border-radius:6px; margin-bottom:10px; white-space:pre-wrap; word-break:break-word; }
  .dry { background:#e8f1fa; border:1px solid #b9d3ea; padding:8px 14px; border-radius:6px; margin-bottom:14px; color:var(--blue); font-weight:600; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 16px; }
  .tabs a { text-decoration:none; color:var(--ink); background:#fff; border:1px solid var(--line); padding:5px 12px; border-radius:999px; font-size:13px; }
  .tabs a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tabs b { margin-left:4px; opacity:.75; }
  h2.group { font-size:16px; margin:26px 0 8px; color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .card.applied { border-left:5px solid var(--ok); } .card.rejected { border-left:5px solid #aaa; opacity:.85; }
  .card.failed, .card.stale { border-left:5px solid var(--bad); } .card.pending { border-left:5px solid #d9b13b; }
  .top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .top .t { font-weight:700; flex:1 1 300px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:#efe8d4; color:#6d5716; text-transform:uppercase; letter-spacing:.04em; font-weight:700; }
  .badge.k-create { background:#e3efe7; color:var(--ok); } .badge.k-chow, .badge.k-chow_link { background:#fbe9c6; color:#8a5a00; }
  .badge.k-duplicate { background:#e6e6f4; color:#46479a; } .badge.k-orphan, .badge.k-manual { background:#f6dfe3; color:var(--bad); }
  .badge.med { background:#fff1d6; color:var(--warn); } .badge.high { background:#e3efe7; color:var(--ok); }
  .sum { color:var(--muted); margin:6px 0 10px; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; margin:6px 0 10px; }
  th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-bottom:1px solid var(--line); padding:4px 8px; }
  td { padding:5px 8px; border-bottom:1px solid #f0ebe0; vertical-align:top; }
  td.old { color:#8a3b4a; } td.new { color:var(--ok); font-weight:600; }
  code, .id { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--muted); }
  .ok { color:var(--ok); font-weight:700; } .no { color:var(--warn); font-weight:700; }
  details { margin:6px 0; } summary { cursor:pointer; color:var(--blue); font-weight:600; font-size:13.5px; }
  ul.notes { margin:6px 0 4px 18px; padding:0; font-size:13.5px; } ul.notes li { margin:3px 0; }
  .btns { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  button { font:inherit; font-weight:600; border-radius:7px; padding:6px 14px; cursor:pointer; border:1px solid var(--line); background:#fff; }
  button.approve { background:var(--ok); border-color:var(--ok); color:#fff; } button.reject { color:var(--bad); border-color:#e5b9c1; }
  input[type=text] { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; min-width:200px; }
  .err { background:#fdecef; border:1px solid #f0c0c9; color:#7a1f31; padding:8px 12px; border-radius:6px; margin:8px 0; word-break:break-word; }
  .bulk { position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:3; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  a { color:var(--accent); } .muted { color:var(--muted); }
  pre { background:#2b1a1d; color:#f3e9d2; padding:10px 12px; border-radius:8px; overflow:auto; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Bellhaven &middot; CRM review</h1>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint=='index' }}">Review queue</a>
    <a href="{{ url_for('report') }}" class="{{ 'on' if request.endpoint=='report' }}">Coverage report</a>
  </nav>
  <div class="meta">
    {% if last %}last pipeline run {{ last.finished_at }} UTC{% else %}pipeline has not run yet{% endif %}
  </div>
</header>
<main>
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
